<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snippet Library</title>
  <style>
    body { margin: 0; color: #21190f; background: #f4ead6; font: 15px/1.45 ui-sans-serif, system-ui; }
    main { max-width: 960px; margin: 0 auto; padding: 36px 24px; }
    h1 { margin: 0 0 8px; font: 700 34px/1.05 Georgia, serif; }
    .list { display: grid; gap: 12px; margin-top: 26px; }
    article { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; border: 1px solid #d0b98f; border-radius: 8px; background: #fff9ed; padding: 16px; }
    code { background: #241f18; color: #9ee8d7; border-radius: 5px; padding: 5px 8px; }
    span { color: #7a6140; }
  </style>
</head>
<body>
  <main>
    <p>sample artifact / UI library</p>
    <h1>Snippet Library</h1>
    <p>Static component inventory for catalog demos.</p>
    <div class="list">
      <article><div><strong>Header block</strong><br><span>Navigation shell with project status.</span></div><code>ready</code></article>
      <article><div><strong>Metric strip</strong><br><span>Compact counters for artifacts and diagnostics.</span></div><code>ready</code></article>
      <article><div><strong>Empty state</strong><br><span>Used when filters hide every artifact.</span></div><code>draft</code></article>
    </div>
  </main>
</body>
</html>
