<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Brief</title>
  <style>
    body { margin: 0; color: #1c2430; background: #f7f8fb; font: 16px/1.55 Georgia, serif; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 24px; }
    h1 { margin: 0 0 10px; font-size: 42px; line-height: 1.02; }
    .kicker, .meta { color: #697386; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: .08em; }
    .callout { margin: 26px 0; border-left: 4px solid #c94f3d; background: #fff; padding: 16px 18px; box-shadow: 0 14px 30px -24px #000; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    article { border-top: 1px solid #d9dee7; padding-top: 12px; }
    b { display: block; font: 700 26px/1 ui-sans-serif, system-ui; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">sample artifact / brief</p>
    <h1>Market Brief</h1>
    <p class="meta">Generated snapshot / not live data</p>
    <p class="callout">The demo brief is deliberately static. It exercises artifact serving without any project backend.</p>
    <div class="grid">
      <article><b>42</b><span>sources</span></article>
      <article><b>7</b><span>themes</span></article>
      <article><b>3</b><span>open questions</span></article>
    </div>
  </main>
</body>
</html>
